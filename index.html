    <script>
        // Seu cronômetro original
        setTimeout(() => {
            document.querySelector('.chuva').style.display = 'none';
        }, 20000);

        const dataInicial = new Date('2025-04-18T00:00:00');

        function diferencaMesesDias(inicio, fim) {
            let anosDiff = fim.getFullYear() - inicio.getFullYear();
            let mesesDiff = fim.getMonth() - inicio.getMonth();
            let diasDiff = fim.getDate() - inicio.getDate();
            if (diasDiff < 0) {
                const ultimoDiaMesAnterior = new Date(fim.getFullYear(), fim.getMonth(), 0).getDate();
                diasDiff += ultimoDiaMesAnterior;
                mesesDiff--;
            }
            if (mesesDiff < 0) {
                mesesDiff += 12;
                anosDiff--;
            }
            return { meses: anosDiff * 12 + mesesDiff, dias: diasDiff };
        }

        function atualizarCronometro() {
            const agora = new Date();
            const { meses, dias } = diferencaMesesDias(dataInicial, agora);
            const horas = agora.getHours();
            const minutos = agora.getMinutes();
            const segundos = agora.getSeconds();

            function atualizarElemento(id, valor) {
                const el = document.getElementById(id);
                const valorStr = String(valor).padStart(2, '0');
                if (el.textContent !== valorStr) {
                    el.textContent = valorStr;
                    el.classList.remove('pulse');
                    void el.offsetWidth;
                    el.classList.add('pulse');
                }
            }

            atualizarElemento('meses', meses);
            atualizarElemento('dias', dias);
            atualizarElemento('horas', horas);
            atualizarElemento('minutos', minutos);
            atualizarElemento('segundos', segundos);
        }

        atualizarCronometro();
        setInterval(atualizarCronometro, 1000);
    </script>
